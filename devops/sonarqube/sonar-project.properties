# SonarQube project configuration
sonar.projectKey=placement-tracker
sonar.projectName=Automated Cloud-Based Placement Tracker
sonar.projectVersion=1.0.0

# Source code paths
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/build/**,**/dist/**

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Language
sonar.language=js

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate
sonar.qualitygate.wait=true

# Coverage thresholds (customize as needed)
# sonar.coverage.exclusions=**/*.test.js,**/tests/**
