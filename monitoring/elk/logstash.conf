input {
  # Read from log files
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "application-log"
  }

  # Receive logs via TCP (from app)
  tcp {
    port => 5044
    codec => json_lines
    type => "tcp-log"
  }

  # Beats input (from Filebeat)
  beats {
    port => 5045
  }
}

filter {
  if [type] == "application-log" {
    # Parse timestamp
    date {
      match => ["timestamp", "YYYY-MM-DD HH:mm:ss"]
      target => "@timestamp"
    }

    # Add environment tag
    mutate {
      add_field => {
        "environment" => "${NODE_ENV:production}"
        "application" => "placement-tracker"
      }
    }

    # Extract log level
    if [level] {
      mutate {
        uppercase => ["level"]
        rename => { "level" => "log_level" }
      }
    }

    # Drop health check noise
    if [message] =~ "GET /health" {
      drop {}
    }

    # Drop metrics scrapes
    if [message] =~ "GET /metrics" {
      drop {}
    }
  }

  # Geo-ip enrichment (optional)
  if [ip] {
    geoip {
      source => "ip"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "placement-tracker-logs-%{+YYYY.MM.dd}"
    template_name => "placement-tracker"
    ilm_enabled => false
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
