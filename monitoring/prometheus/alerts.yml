groups:
  - name: placement-tracker-alerts
    rules:
      # ── Backend Down ───────────────────────────────────────────────────────
      - alert: BackendDown
        expr: up{job="placement-tracker-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Placement Tracker Backend is DOWN"
          description: "The backend API has been unreachable for more than 1 minute."

      # ── High Error Rate ────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(placement_tracker_http_requests_total{status_code=~"5.."}[5m])
          / rate(placement_tracker_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"
          description: "More than 5% of requests are returning 5xx errors."

      # ── High Response Time ─────────────────────────────────────────────────
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(placement_tracker_http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 response time > 2 seconds"
          description: "95th percentile latency is above 2 seconds."

      # ── High Memory Usage ──────────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes{job="placement-tracker-backend"} / 1024 / 1024) > 450
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend memory usage above 450MB"

      # ── MongoDB Connection Issues ──────────────────────────────────────────
      - alert: MongoDBConnectionIssue
        expr: mongodb_connections{state="current"} > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many MongoDB connections"
          description: "MongoDB has more than 200 active connections."
