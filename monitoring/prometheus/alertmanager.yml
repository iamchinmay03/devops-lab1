global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@placetrack.yourdomain.com'
  smtp_auth_username: 'alerts@placetrack.yourdomain.com'
  smtp_auth_password: 'your_app_password'

# ── Routing ───────────────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: 'default'
    email_configs:
      - to: 'team@placetrack.yourdomain.com'
        subject: '[PlaceTrack] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@placetrack.yourdomain.com'
        subject: '🔴 [CRITICAL] {{ .GroupLabels.alertname }}'
    # Uncomment for Slack:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts-critical'
    #     title: '🔴 Critical Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@placetrack.yourdomain.com'
        subject: '🟡 [WARNING] {{ .GroupLabels.alertname }}'

# ── Inhibition Rules ──────────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
