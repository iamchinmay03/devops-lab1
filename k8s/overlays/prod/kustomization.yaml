apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: placement-tracker

resources:
  - ../../base/all-resources.yaml
  - ../../base/backend-deployment.yaml

# ── Production-specific patches ───────────────────────────────────────────────
patches:
  # Scale backend to 3 replicas in production
  - target:
      kind: Deployment
      name: placement-tracker-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Scale frontend to 3 replicas in production
  - target:
      kind: Deployment
      name: placement-tracker-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Increase HPA max for backend
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20

# ── Production ConfigMap overrides ────────────────────────────────────────────
configMapGenerator:
  - name: placement-tracker-config
    behavior: merge
    literals:
      - node-env=production
      - frontend-url=https://placetrack.yourdomain.com

# ── Image tags (updated by CI/CD) ─────────────────────────────────────────────
images:
  - name: yourdockerhubuser/placement-tracker-backend
    newTag: latest
  - name: yourdockerhubuser/placement-tracker-frontend
    newTag: latest
