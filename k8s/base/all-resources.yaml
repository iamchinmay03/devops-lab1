  jwt-secret: eW91cl9zdXBlcl9zZWNyZXRfand0X2tleV9jaGFuZ2VfaW5fcHJvZHVjdGlvbl8zMmNoYXJz
  jwt-refresh-secret: eW91cl9yZWZyZXNoX3NlY3JldF9rZXlfY2hhbmdlX2luX3Byb2R1Y3Rpb24=
