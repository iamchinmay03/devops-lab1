apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-tracker-backend
  namespace: placement-tracker
  labels:
    app: placement-tracker-backend
    version: "1.0"
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-tracker-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: placement-tracker-backend
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: placement-tracker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # ─── Init container: wait for MongoDB ────────────────────────────────
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb-service 27017; do echo waiting for MongoDB; sleep 2; done']

      containers:
        - name: backend
          image: yourdockerhubuser/placement-tracker-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
            - containerPort: 9091
              name: metrics
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI_PROD
              valueFrom:
                secretKeyRef:
                  name: placement-tracker-secrets
                  key: mongodb-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: placement-tracker-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: placement-tracker-secrets
                  key: jwt-refresh-secret
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: placement-tracker-config
                  key: frontend-url
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: logs
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - placement-tracker-backend
                topologyKey: kubernetes.io/hostname
