name: 🚀 PlaceTrack CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_BACKEND:  ${{ secrets.DOCKERHUB_USERNAME }}/placement-tracker-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/placement-tracker-frontend
  IMAGE_TAG:      ${{ github.run_number }}-${{ github.sha }}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test -- --coverage --forceExit
        env:
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET:  test_secret_key_at_least_32_characters
          JWT_REFRESH_SECRET: test_refresh_secret_key
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=placement-tracker
            -Dsonar.sources=backend/src
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5

  # ════════════════════════════════════════════════════════════════════════════
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ════════════════════════════════════════════════════════════════════════════
  build-push:
    name: 🐳 Build & Push Images
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            REACT_APP_API_URL=${{ secrets.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Update K8s manifest image tags
        run: |
          sed -i "s|image: .*/placement-tracker-backend:.*|image: ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}|" k8s/base/backend-deployment.yaml
          sed -i "s|image: .*/placement-tracker-frontend:.*|image: ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}|" k8s/base/all-resources.yaml
          git config user.email "ci@placetrack.com"
          git config user.name "GitHub Actions"
          git add k8s/
          git diff --staged --quiet || git commit -m "ci: update images to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy via ArgoCD
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger ArgoCD sync
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

          argocd app sync placement-tracker \
            --server   ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure --timeout 300

          argocd app wait placement-tracker \
            --server   ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure --health --timeout 300

      - name: Smoke test
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.API_URL }}/health)
          [ "$STATUS" = "200" ] && echo "✅ Smoke test passed" || (echo "❌ Failed: $STATUS" && exit 1)
